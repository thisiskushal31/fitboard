name: Release

# A semver tag (X.Y.Z or X.Y.Z-lts, with or without a leading v) builds the
# production image and publishes the GitHub release. A push to main does not.

on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-lts"
      - "v*.*.*"
      - "v*.*.*-lts"

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version / channel
        id: meta
        run: |
          RAW="${GITHUB_REF_NAME}"
          VER="${RAW#v}"
          IS_LTS=false
          if [[ "$RAW" == *-lts ]]; then
            VER="${VER%-lts}"
            IS_LTS=true
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "is_lts=${IS_LTS}" >> "$GITHUB_OUTPUT"

      - name: Image name
        # GHCR names must be lower case.
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "IMAGE=${IMAGE}"
            echo "TAGS<<EOF"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo "${IMAGE}:${GITHUB_REF_NAME}"
            if [ "${{ steps.meta.outputs.is_lts }}" != "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fresh notes every publish. Updating a release with generated notes
          # appends another Full Changelog line, so the body is replaced below.
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            --jq .body > /tmp/generated.md
          python3 - << 'PY'
          from pathlib import Path
          lines = Path("/tmp/generated.md").read_text().splitlines()
          body, changelogs = [], []
          for line in lines:
              plain = line.replace("*", "").strip().lower()
              if plain.startswith("full changelog:"):
                  changelogs.append(line.strip())
              else:
                  body.append(line)
          while body and not body[-1].strip():
              body.pop()
          if changelogs:
              body += ["", changelogs[-1]]
          Path("release-notes.md").write_text("\n".join(body).rstrip() + "\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.is_lts == 'true' && format('{0} LTS', steps.meta.outputs.version) || steps.meta.outputs.version }}
          body_path: release-notes.md
          append_body: false
