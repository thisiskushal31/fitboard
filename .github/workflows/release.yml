name: Release

# A semver tag (X.Y.Z or X.Y.Z-lts, with or without a leading v) builds the
# production image and publishes the GitHub release. The release body comes
# from changelog/<version>.md (required before tagging). A push to main does not.

on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-lts"
      - "v*.*.*"
      - "v*.*.*-lts"

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version / channel
        id: meta
        run: |
          RAW="${GITHUB_REF_NAME}"
          VER="${RAW#v}"
          IS_LTS=false
          if [[ "$RAW" == *-lts ]]; then
            VER="${VER%-lts}"
            IS_LTS=true
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "is_lts=${IS_LTS}" >> "$GITHUB_OUTPUT"

      - name: Image name
        # GHCR names must be lower case.
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "IMAGE=${IMAGE}"
            echo "TAGS<<EOF"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo "${IMAGE}:${GITHUB_REF_NAME}"
            if [ "${{ steps.meta.outputs.is_lts }}" != "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write release notes
        env:
          NOTES_FILE: changelog/${{ steps.meta.outputs.version }}.md
        run: |
          set -euo pipefail
          # Fresh body every publish (including force re-tag / update of an
          # existing release). Never append: softprops with append_body would
          # stack another Full Changelog line on each run.
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Missing $NOTES_FILE — add curated release notes before tagging." >&2
            exit 1
          fi
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          export PREV
          python3 - << 'PY'
          import os
          from pathlib import Path

          notes = Path(os.environ["NOTES_FILE"])
          lines, skipped = [], []
          for line in notes.read_text().splitlines():
              plain = line.replace("*", "").strip().lower()
              if plain.startswith("full changelog:"):
                  skipped.append(line.strip())
                  continue
              lines.append(line)
          while lines and not lines[-1].strip():
              lines.pop()
          body = "\n".join(lines).rstrip()
          prev = os.environ.get("PREV", "").strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          parts = [body] if body else []
          # Exactly one compare link — drop any that were in the markdown file.
          if prev:
              parts.append(f"Full Changelog: https://github.com/{repo}/compare/{prev}...{tag}")
          elif skipped:
              parts.append(skipped[-1])
          Path("release-notes.md").write_text(("\n\n".join(parts) + "\n") if parts else "\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.is_lts == 'true' && format('{0} LTS', steps.meta.outputs.version) || steps.meta.outputs.version }}
          body_path: release-notes.md
          # Replace the whole body on update; do not append to a prior publish.
          append_body: false
